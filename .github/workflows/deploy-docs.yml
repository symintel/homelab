name: Build y desplegar documentación (MkDocs -> GitHub Pages)
# La lógica vive en symintel/core-pipelines (workflow reutilizable, corre en arc-runners).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# El workflow reutilizable no puede pedir más permisos de los que da el caller.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    # Probando: @main. Cuando todo funcione, crear el tag v1 en core-pipelines y usar:
    # uses: symintel/core-pipelines/.github/workflows/mkdocs.yml@v1
    uses: symintel/core-pipelines/.github/workflows/mkdocs.yml@main
    with:
      deploy: true

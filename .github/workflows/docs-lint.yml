name: Lint docs y manifiestos (solo en Pull Requests)
# La lógica vive en symintel/core-pipelines (workflows reutilizables, corren en arc-runners).
on:
  pull_request:
    branches: [main]

jobs:
  docs:
    # Probando: @main. Cuando todo funcione, crear el tag v1 en core-pipelines y usar:
    # uses: symintel/core-pipelines/.github/workflows/mkdocs.yml@v1
    uses: symintel/core-pipelines/.github/workflows/mkdocs.yml@main
    with:
      markdownlint-globs: 'docs/**/*.md README.md'

  ansible:
    # uses: symintel/core-pipelines/.github/workflows/ansible.yml@v1
    uses: symintel/core-pipelines/.github/workflows/ansible.yml@main
    with:
      directory: ansible

  opentofu:
    # uses: symintel/core-pipelines/.github/workflows/tofu-validate.yml@v1
    uses: symintel/core-pipelines/.github/workflows/tofu-validate.yml@main
    with:
      working-directory: opentofu

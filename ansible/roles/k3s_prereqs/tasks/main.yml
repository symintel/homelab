---
- name: Deshabilitar swap en runtime
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Comentar swap en fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+)'
    replace: '# \1'

- name: Cargar modulos de kernel para K3s
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
      overlay
    mode: "0644"

- name: Cargar modulos ahora
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Configurar sysctl para CNI
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k3s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
    mode: "0644"

- name: Aplicar sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

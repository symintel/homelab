---
- name: Omitir CNI externo si Flannel embebido
  ansible.builtin.meta: end_host
  when: k3s_install.core.cni | default('flannel') == 'flannel'

- name: Etiqueta de espera según CNI
  ansible.builtin.set_fact:
    k3s_cni_wait_label: >-
      {{
        'k8s-app=canal' if k3s_install.core.cni == 'canal'
        else ('k8s-app=calico-node' if k3s_install.core.cni == 'calico'
        else 'k8s-app=cilium')
      }}
    k3s_cni_wait_namespace: >-
      {{ 'calico-system' if k3s_install.core.cni == 'calico' else 'kube-system' }}

- name: Comprobar API K3s
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_cni_api
  changed_when: false
  failed_when: false

- name: Fallar si el API no responde
  ansible.builtin.fail:
    msg: >-
      K3s API no disponible. Ejecuta el play del server antes del rol k3s_cni.
  when: k3s_cni_api.rc != 0

- name: Instalar Canal
  when: k3s_install.core.cni == 'canal'
  block:
    - name: Descargar manifest Canal
      ansible.builtin.get_url:
        url: "{{ k3s_cni_canal_manifest_url }}"
        dest: /tmp/canal.yaml
        mode: "0644"
      when: not ansible_check_mode

    - name: Aplicar Canal
      ansible.builtin.command: k3s kubectl apply -f /tmp/canal.yaml
      register: canal_apply
      changed_when: "'created' in canal_apply.stdout or 'configured' in canal_apply.stdout"
      when: not ansible_check_mode

- name: Instalar Calico (operator + custom resources)
  when: k3s_install.core.cni == 'calico'
  block:
    - name: Aplicar Tigera operator
      ansible.builtin.command: >-
        k3s kubectl apply --server-side --force-conflicts
        -f {{ k3s_cni_calico_operator_url }}
      register: calico_op
      changed_when: "'created' in calico_op.stdout or 'configured' in calico_op.stdout"
      when: not ansible_check_mode

    - name: Renderizar custom resources Calico
      ansible.builtin.template:
        src: calico-custom-resources.yaml.j2
        dest: /tmp/calico-custom-resources.yaml
        mode: "0600"

    - name: Aplicar custom resources Calico
      ansible.builtin.command: >-
        k3s kubectl apply --server-side --force-conflicts
        -f /tmp/calico-custom-resources.yaml
      register: calico_cr
      changed_when: "'created' in calico_cr.stdout or 'configured' in calico_cr.stdout"
      when: not ansible_check_mode

- name: Instalar Cilium (quick-install manifest)
  when: k3s_install.core.cni == 'cilium'
  block:
    - name: Aplicar Cilium
      ansible.builtin.command: k3s kubectl apply -f {{ k3s_cni_cilium_manifest_url }}
      register: cilium_apply
      changed_when: "'created' in cilium_apply.stdout or 'configured' in cilium_apply.stdout"
      when: not ansible_check_mode

- name: Esperar pods del CNI
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=ready pod
    -l {{ k3s_cni_wait_label }}
    -n {{ k3s_cni_wait_namespace }} --timeout=300s
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

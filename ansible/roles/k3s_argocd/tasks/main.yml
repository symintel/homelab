---
- name: Comprobar acceso kubectl en server
  ansible.builtin.command: k3s kubectl get nodes
  register: argocd_kubectl
  changed_when: false
  failed_when: false

- name: Crear namespace argocd
  ansible.builtin.command: k3s kubectl create namespace argocd
  register: argocd_ns
  failed_when: argocd_ns.rc != 0 and 'AlreadyExists' not in argocd_ns.stderr
  changed_when: argocd_ns.rc == 0
  when: argocd_kubectl.rc == 0

- name: Instalar ArgoCD controller
  ansible.builtin.command: >-
    k3s kubectl apply -n argocd
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ k3s_install.gitops_argocd.version }}/manifests/install.yaml
  register: argocd_install
  changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout"
  when: argocd_kubectl.rc == 0

- name: Esperar argocd-server Ready
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=available deployment/argocd-server
    -n argocd --timeout=300s
  changed_when: false
  when:
    - not ansible_check_mode
    - argocd_kubectl.rc == 0

- name: Recordar paso GitOps post-bootstrap
  ansible.builtin.debug:
    msg: >-
      ArgoCD controller listo. Aplica el ApplicationSet de bootstrap desde gitops:
      kubectl apply -f bootstrap/root-appset.yaml
      (repo: {{ k3s_install.gitops_argocd.gitops_repo_url }})
  when: argocd_kubectl.rc == 0

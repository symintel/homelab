---
- name: Recargar AppArmor
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/usr.sbin.named
  changed_when: true
  when: not (ansible_check_mode and bind_dns_pkg is changed)

- name: Reiniciar named
  ansible.builtin.systemd:
    name: named
    state: restarted
  when: not (ansible_check_mode and bind_dns_pkg is changed)

- name: Recargar zonas BIND
  ansible.builtin.command: rndc reload
  changed_when: true
  when: not (ansible_check_mode and bind_dns_pkg is changed)

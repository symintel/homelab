---
# Secretos OAuth Dex: generar en 1Password, aplicar en ArgoCD e Incus.
#
# Requiere: app 1Password desbloqueada, pip install onepassword-sdk, kubectl.
# GitHub: GITHUB_CLIENT_ID y GITHUB_CLIENT_SECRET en 1Password (manual).
#
#   cd ansible
#   ansible-playbook -i inventory.ini playbook-dex-oauth-secrets.yml
#
# Tags:
#   ensure     — solo generar/verificar INCUS + VCLUSTER en 1Password
#   argocd     — patch argocd-secret + restart Dex
#   vcluster   — VCLUSTER_CLIENT_SECRET en release Helm vcluster-platform
#   incus      — oidc.client.secret en invincible
#   incus_auth — grupos incus auth (denegar por defecto + admins)
#
- name: Secretos OAuth Dex — 1Password (estación operador)
  hosts: localhost
  connection: local
  # Corre en la estación del operador: sin sudo (ansible.cfg tiene become=True).
  become: false
  gather_facts: false
  vars_files:
    - group_vars/dex_oauth_secrets.yml
  environment:
    DEX_OAUTH_GENERATED_FIELDS: "{{ dex_oauth_generated_fields | join(',') }}"
  tasks:
    - name: Asegurar secretos OAuth generados en 1Password
      ansible.builtin.command:
        cmd: python3 scripts/ensure_dex_oauth_secrets.py --json
        chdir: "{{ playbook_dir }}"
      register: dex_oauth_ensure
      changed_when: (dex_oauth_ensure.stdout | from_json).generated | length > 0
      no_log: true
      tags:
        - ensure
        - argocd
        - incus
        - incus_auth
        - vcluster

    - name: Guardar valores OAuth generados (facts locales)
      ansible.builtin.set_fact:
        dex_oauth_fields: "{{ dex_oauth_ensure.stdout | from_json }}"
      no_log: true
      tags:
        - ensure
        - argocd
        - incus
        - incus_auth
        - vcluster

    - name: Aplicar secretos OAuth en argocd-secret
      ansible.builtin.command:
        cmd: python3 scripts/apply_dex_oauth_to_argocd.py
        chdir: "{{ playbook_dir }}"
      when: dex_oauth.apply_argocd | default(true)
      changed_when: true
      tags:
        - argocd

    - name: Reiniciar argocd-dex-server
      ansible.builtin.command:
        cmd: kubectl rollout restart deployment argocd-dex-server -n argocd
      when: dex_oauth.restart_dex | default(true) and (dex_oauth.apply_argocd | default(true))
      changed_when: true
      tags:
        - argocd

    - name: Aplicar VCLUSTER_CLIENT_SECRET en vCluster Platform (Helm)
      ansible.builtin.command:
        cmd: python3 scripts/apply_dex_oauth_to_vcluster.py
        chdir: "{{ playbook_dir }}"
      when: dex_oauth.apply_vcluster | default(false)
      changed_when: true
      tags:
        - vcluster

- name: Incus OIDC — nodo bootstrap
  hosts: invincible
  gather_facts: false
  vars_files:
    - group_vars/dex_oauth_secrets.yml
  environment:
    DEX_OAUTH_GENERATED_FIELDS: "{{ dex_oauth_generated_fields | join(',') }}"
  tasks:
    - name: Asegurar secretos en 1Password (delegado a estación operador)
      ansible.builtin.command:
        cmd: python3 scripts/ensure_dex_oauth_secrets.py --json
        chdir: "{{ playbook_dir }}"
      delegate_to: localhost
      run_once: true
      register: dex_oauth_ensure_incus
      changed_when: (dex_oauth_ensure_incus.stdout | from_json).generated | length > 0
      no_log: true
      when: dex_oauth.apply_incus | default(false)
      tags:
        - incus
        - incus_auth

    - name: Facts OAuth para Incus
      ansible.builtin.set_fact:
        dex_oauth_incus_secret: "{{ dex_oauth_ensure_incus.stdout | from_json }}"
      when: dex_oauth.apply_incus | default(false)
      no_log: true
      tags:
        - incus
        - incus_auth

    - name: Configurar OIDC issuer en Incus
      ansible.builtin.command:
        cmd: incus config set oidc.issuer {{ dex_oauth.incus_oidc.issuer }}
      when: dex_oauth.apply_incus | default(false)
      changed_when: true
      tags:
        - incus

    - name: Configurar OIDC client id en Incus
      ansible.builtin.command:
        cmd: incus config set oidc.client.id {{ dex_oauth.incus_oidc.client_id }}
      when: dex_oauth.apply_incus | default(false)
      changed_when: true
      tags:
        - incus

    - name: Configurar OIDC groups claim en Incus
      ansible.builtin.command:
        cmd: incus config set oidc.groups.claim {{ dex_oauth.incus_oidc.groups_claim }}
      when: dex_oauth.apply_incus | default(false)
      changed_when: true
      tags:
        - incus

    - name: Configurar OIDC client secret en Incus (desde 1Password vía Ansible)
      ansible.builtin.command:
        cmd: >-
          incus config set oidc.client.secret
          {{ dex_oauth_incus_secret.fields.INCUS_CLIENT_SECRET }}
      when: dex_oauth.apply_incus | default(false)
      changed_when: true
      no_log: true
      tags:
        - incus

    - name: Crear grupo homelab-admins
      ansible.builtin.command:
        cmd: incus auth group create {{ dex_oauth.incus_auth.admin_group }}
      register: incus_admin_group
      failed_when: incus_admin_group.rc != 0 and 'already exists' not in (incus_admin_group.stderr | default(''))
      changed_when: incus_admin_group.rc == 0
      when: dex_oauth.configure_incus_auth | default(false)
      tags:
        - incus_auth

    - name: Permiso admin del servidor al grupo homelab-admins
      ansible.builtin.command:
        cmd: incus auth group permission add {{ dex_oauth.incus_auth.admin_group }} server admin
      when: dex_oauth.configure_incus_auth | default(false)
      changed_when: true
      tags:
        - incus_auth

    - name: Crear identity-provider-group mapeado a Dex/GitHub
      ansible.builtin.command:
        cmd: incus auth identity-provider-group create {{ dex_oauth.incus_auth.idp_group | quote }}
      register: incus_idp_group
      failed_when: incus_idp_group.rc != 0 and 'already exists' not in (incus_idp_group.stderr | default(''))
      changed_when: incus_idp_group.rc == 0
      when: dex_oauth.configure_incus_auth | default(false)
      tags:
        - incus_auth

    - name: Vincular IdP group a homelab-admins
      ansible.builtin.command:
        cmd: >-
          incus auth identity-provider-group group add
          {{ dex_oauth.incus_auth.idp_group | quote }}
          {{ dex_oauth.incus_auth.admin_group }}
      when: dex_oauth.configure_incus_auth | default(false)
      changed_when: true
      tags:
        - incus_auth

---
# Instala BIND en deborah dentro de un chroot, lo configura para escuchar en
# su IP de la LAN y sirve tres zonas, generadas desde el inventario y group_vars:
#   - mco.local                  nombres de los hosts (un A por nodo, ns, k3s)
#   - 20.168.192.in-addr.arpa    reversa de esa red (PTR)
#   - homelab.local              servidores y servicios publicados, cada uno con su
#                                registro (incus, argocd, vcluster y api -> gateway_ip).
#                                Sin comodín: un nombre nuevo necesita su registro.
#
# Ejecutar:
#   ansible-playbook -i inventory.ini playbook-bind-dns.yml

- name: Instalar y configurar BIND (mco.local, homelab.local)
  hosts: deborah
  become: true
  roles:
    - role: bind_dns

---
# playbook-dex-oauth-secrets.yml — secretos OAuth Dex (1Password + clúster)
#
# Campos generados por Ansible (si faltan en 1Password): INCUS_CLIENT_SECRET,
# VCLUSTER_CLIENT_SECRET. Los de GitHub debes crearlos en la OAuth App y en 1Password.

dex_oauth:
  apply_argocd: true
  restart_dex: true
  apply_incus: false
  configure_incus_auth: false
  apply_vcluster: false
  incus_oidc:
    issuer: https://argocd.homelab.local/api/dex
    client_id: incus-ui
    groups_claim: groups
  incus_auth:
    admin_group: homelab-admins
    # Claim groups de Dex para el team devops de la org symintel (dex.config).
    idp_group: "symintel:devops"

# Campos OAuth que Ansible genera en 1Password cuando no existen.
# Misma lista se pasa a los scripts vía DEX_OAUTH_GENERATED_FIELDS.
# Los de GitHub (GITHUB_*) se crean manualmente en la OAuth App.
dex_oauth_generated_fields:
  - INCUS_CLIENT_SECRET   # → argocd-secret + incus oidc.client.secret
  - VCLUSTER_CLIENT_SECRET  # → argocd-secret + Helm vcluster-platform

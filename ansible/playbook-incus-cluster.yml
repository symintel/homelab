---
# Bootstrap / join / post — ver group_vars/incus_cluster.yml
- name: Bootstrap del clúster Incus (leader)
  hosts: invincible
  become: true
  vars:
    incus_cluster_phase: bootstrap
  roles:
    - role: incus_cluster
  tags: [bootstrap, always]

# Todos los nodos del clúster menos el leader: un nodo nuevo en inventory.ini
# (grupo incus_cluster) se une sin editar este playbook.
- name: Unir miembros al clúster Incus
  hosts: incus_cluster:!invincible
  become: true
  serial: 1
  vars:
    incus_cluster_phase: join
  roles:
    - role: incus_cluster
  tags: [join, always]

- name: Cluster groups, scheduler e UI Incus
  hosts: invincible
  become: true
  vars:
    incus_cluster_phase: post
  roles:
    - role: incus_cluster
      tags: [groups, scheduler, always]
    - role: incus_ui
      tags: [ui, always]

# --- OVN (opcional) -------------------------------------------------------------------------
# Apagado por defecto (incus_ovn_enabled: false en group_vars/incus_cluster/ovn.yml): un playbook
# completo no lo toca. Preflight:  --tags ovn -e incus_ovn_enabled=true
# Instalar:  --tags ovn -e incus_ovn_enabled=true -e incus_ovn_confirm=true
- name: OVN - preflight en los nodos
  hosts: incus_cluster
  become: true
  gather_facts: false
  vars:
    incus_ovn_phase: preflight
  roles:
    - role: incus_ovn
      when: incus_ovn_enabled | bool
  tags: [ovn]

- name: OVN - base de datos en cada nodo (el líder primero)
  hosts: incus_cluster
  become: true
  gather_facts: false
  serial: 1
  vars:
    incus_ovn_phase: install
  roles:
    - role: incus_ovn
      when: incus_ovn_enabled | bool
  tags: [ovn]

- name: OVN - redes de Incus (uplink y red OVN)
  hosts: invincible
  become: true
  gather_facts: false
  vars:
    incus_ovn_phase: networks
  roles:
    - role: incus_ovn
      when: incus_ovn_enabled | bool
  tags: [ovn]
